<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraria Weapon Randomizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img id="terrariaLogo" src="./images/logo/logo.png" alt="Terraria">

    <div id="mainContent">

        <div id="weaponImageContainer">
            <img id="weaponImage" src="" alt="">
        </div>

        <h1 id="weaponDisplay">Click the button!</h1>

        <h2 id="stageDisplay">King Slime(1/15)</h2>

        <button id="getRandomWeapon">Get Random weapon</button>

        <button id="previousButton">Previous Stage</button>
        <button id="nextButton">Next Stage</button>
        
        <button id="clearBlackListButton">Clear Used Weapons</button>

        <div id="versionText">Terraria Version 1.4.5.8</div>
    </div>

    <script src="index.js"></script>
</body>
</html>
